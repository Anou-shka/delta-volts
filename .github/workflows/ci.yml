name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install LibreOffice (recalculates the Excel model)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc-nogui
      - name: Extraction tie-outs and Excel model checks
        run: make test
